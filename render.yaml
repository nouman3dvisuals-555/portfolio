services:
  - type: web
    name: nouman-portfolio-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: AUTHORIZED_ADMIN_EMAIL
        value: nouman3dvisuals@gmail.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ENABLE_DEV_ADMIN_BYPASS
        value: "false"
      - key: EMAIL_USER
        value: nouman3dvisuals@gmail.com
      - key: EMAIL_PASS
        sync: false
      - key: CLIENT_URL
        sync: false
